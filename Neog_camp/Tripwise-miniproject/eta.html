<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETA Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>

  <body>
    <header class="container">
      <nav>
        <nav>
          <ul>
            <li>
              <a href="index.html"><h5>TripeWise Tools</h5></a>
            </li>
          </ul>
        </nav>
        <ul>
          <li><a href="averageSpeed.html">Average Speed</a></li>
          <li><a href="eta.html">ETA</a></li>
          <li><a href="fuelCost.html">Fuel Cost</a></li>
          <li><a href="itineraryCost.html">Itinerary Cost</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>ETA Calculator</h1>
      <hr />
      <fieldset>
        <p>Distance (km):</p>
        <input
          id="distanceId"
          type="number"
          placeholder="Enter distance in km"
          required
        />
        <p>Speed (km/h):</p>
        <input
          id="speedId"
          type="number"
          placeholder="Enter speed in km/h"
          required
        />
        <input id="btnId" type="submit" value="Calculate ETA" />
      </fieldset>
      <p id="resultId"></p>
    </main>

    <footer class="container">
      <small>
        Go from zero to hero at full stack development with
        <a href="https://neog.camp">neog.camp</a>
      </small>
    </footer>
    <script>
      function calEta() {
        const distanceElement = document.getElementById("distanceId");
        const speedElement = document.getElementById("speedId");
        const resultElement = document.getElementById("resultId");
        const distance = parseFloat(distanceElement.value);
        const speed = parseFloat(speedElement.value);

        if (distance <= 0 || speed <= 0) {
          resultElement.innerText = "Please enter valid inputs";
          return;
        } else {
          const eta = distance / speed;
          resultElement.innerText =
            "Estimated Time of Arrival: " + eta + " hours";
        }
      }

      btnElement = document.getElementById("btnId");
      btnElement.addEventListener("click", calEta);
    </script>
  </body>
</html>
