<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fuel Cost Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>

  <body>
    <header class="container">
      <nav>
        <nav>
          <ul>
            <li>
              <a href="index.html"><h5>TripeWise Tools</h5></a>
            </li>
          </ul>
        </nav>
        <ul>
          <li><a href="averageSpeed.html">Average Speed</a></li>
          <li><a href="eta.html">ETA</a></li>
          <li><a href="fuelCost.html">Fuel Cost</a></li>
          <li><a href="itineraryCost.html">Itinerary Cost</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>Fuel Cost Calculator</h1>
      <hr />
      <fieldset>
        <p>Distance (km):</p>
        <input
          id="distanceId"
          type="number"
          placeholder="Enter distance in km"
          required
        />
        <p>FuelEfficiency (km/h):</p>
        <input
          id="fuelEfficiencyId"
          type="number"
          placeholder="Enter fuel efficiency in km/h"
          required
        />

        <p>Fuel Price(per litre):</p>
        <input
          id="fuelPriceId"
          type="number"
          placeholder="
        Enter fuel price per litre"
          required
        />
        <input id="btnId" type="submit" value="Calculate Cost" />
      </fieldset>
      <p id="resultId"></p>
    </main>

    <footer class="container">
      <small>
        Go from zero to hero at full stack development with
        <a href="https://neog.camp">neog.camp</a>
      </small>
    </footer>
    <script>
      function calFuelPrice() {
        const distanceElement = document.getElementById("distanceId");
        const fuelEfficiencyElement =
          document.getElementById("fuelEfficiencyId");
        const fuelPriceElement = document.getElementById("fuelPriceId");

        const resultElement = document.getElementById("resultId");

        const distance = parseFloat(distanceElement.value);
        const fuelEfficiency = parseFloat(fuelEfficiencyElement.value);
        const fuelPrice = parseFloat(fuelPriceElement.value);

        if (distance <= 0 || fuelEfficiency <= 0 || fuelPrice <= 0) {
          resultElement.innerText = "Please enter valid inputs";
          return;
        } else {
          const fuelNeeded = distance / fuelEfficiency;

          const totalCost = fuelNeeded * fuelPrice;

          if (fuelEfficiency < 10) {
            resultElement.innerText =
              "Warning: Efficiency is below acceptable threshold(<10 km/l) Total Fuel Cost: ₹" +
              totalCost.toFixed(2);
          } else {
            resultElement.innerText =
              "Total Fuel Cost: ₹" + totalCost.toFixed(2);
          }
        }
      }

      btnElement = document.getElementById("btnId");
      btnElement.addEventListener("click", calFuelPrice);
    </script>
  </body>
</html>
