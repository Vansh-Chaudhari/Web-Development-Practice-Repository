<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Your place to get started with semantic web development"
    />
    <title>Github Url generator</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container">
      <nav>
        <nav>
          <ul>
            <li>
              <a href="index.html">SmartMarketer Tools</a>
            </li>
          </ul>
        </nav>
        <ul>
          <li><a href="wami.html">WAMI Link</a></li>
          <li><a href="twitter.html">Tweet Link Generator</a></li>
          <li><a href="github.html">GitHub Link</a></li>
        </ul>
      </nav>
      <hr />
      <hgroup>
        <h1>Github url generator</h1>
        <p>Get your Github link URL from just your username</p>
      </hgroup>
    </header>
    <main class="container">
      <fieldset>
        <input
          type="text"
          id="githubInput"
          placeholder="Enter Github Username"
        />

        <input type="submit" id="btnInput" value="Generate Url" />
      </fieldset>
      <div id="app"></div>
    </main>
    <footer class="container neog-footer">
      <small>
        go from zero to hero at full stack development with
        <a href="https://neog.camp">neog.camp</a>
      </small>
    </footer>
    <script>
      // const username = "vansh-chaudhari";

      function githubUrl(user) {
        return "https://github.com/" + user;
      }

      function handleGenerateClick() {
        const githubUrlInput = githubUrl(inputElement.value);
        appElement.innerText = githubUrlInput;
      }

      //const github_user = githubUrl(username);
      // console.log("Your profile is: " + github_user);

      const appElement = document.getElementById("app");
      const inputElement = document.getElementById("githubInput");
      const btnElement = document.getElementById("btnInput");
      btnElement.addEventListener("click", handleGenerateClick);
    </script>
  </body>
</html>
